<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <title>Localisation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    var map, marker;

    function initMap() {
      var defaultPos = { lat: 36.8188, lng: 10.1658 }; // Tunis par défaut

      map = new google.maps.Map(document.getElementById('map'), {
        zoom: 14,
        center: defaultPos,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
        styles: [
          { featureType: "poi.medical", stylers: [{ visibility: "on" }] },
          { elementType: "geometry", stylers: [{ color: "#f5f5f5" }] },
          { elementType: "labels.text.fill", stylers: [{ color: "#616161" }] },
          { featureType: "water", elementType: "geometry",
            stylers: [{ color: "#c9d8e8" }] }
        ]
      });

      marker = new google.maps.Marker({
        position: defaultPos,
        map: map,
        animation: google.maps.Animation.DROP
      });
    }

    /**
     * Appelé depuis Java via webEngine.executeScript("locateAddress('...')")
     * Géocode l'adresse et centre la carte.
     */
    function locateAddress(address) {
      var geocoder = new google.maps.Geocoder();
      geocoder.geocode({ address: address }, function(results, status) {
        if (status === 'OK' && results[0]) {
          var pos = results[0].geometry.location;
          map.setCenter(pos);
          map.setZoom(15);
          marker.setPosition(pos);
          marker.setAnimation(google.maps.Animation.DROP);

          // Info window au clic sur marker
          var infoWindow = new google.maps.InfoWindow({
            content: '<div style="font-family:Arial;font-size:13px;padding:4px;">' +
                     '<b>' + address + '</b></div>'
          });
          marker.addListener('click', function() {
            infoWindow.open(map, marker);
          });
        } else {
          console.warn('Géocodage échoué : ' + status);
        }
      });
    }
  </script>

  <!-- Clé API Google Maps -->
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCo_DjWHU1_zi0at-C8Ped9r97I_x2leXM&callback=initMap">
  </script>
</body>
</html>
