<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <title>reCAPTCHA</title>
  <script src="https://www.google.com/recaptcha/api.js?render=6LePU8UsAAAAAAIWMzf06qlmaf8WP8AXOxQvz6Nm"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 80px;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #status {
      padding: 6px 14px;
      border-radius: 6px;
      background: #f0fafa;
      border: 1px solid #b2dfdb;
      color: #00796b;
    }
    #status.error {
      background: #fce4e4;
      border-color: #ef9a9a;
      color: #c62828;
    }
  </style>
</head>
<body>
  <div id="status">Chargement…</div>

  <script>
    // Token global accessible depuis Java via getCaptchaToken()
    var captchaToken = "";
    var captchaReady = false;

    // Attendre que grecaptcha soit prêt
    grecaptcha.ready(function() {
      captchaReady = true;
      document.getElementById("status").textContent = "Prêt ✓";
      // Générer un premier token au chargement
      executeCaptcha();
    });

    /**
     * Appelé depuis Java via webEngine.executeScript("executeCaptcha()")
     * Génère un nouveau token frais.
     */
    function executeCaptcha() {
      if (!captchaReady) {
        document.getElementById("status").textContent = "En attente reCAPTCHA…";
        return;
      }
      var status = document.getElementById("status");
      status.textContent = "Vérification…";
      status.className = "";
      captchaToken = ""; // reset avant nouvelle génération

      grecaptcha.execute(
        "6LePU8UsAAAAAAIWMzf06qlmaf8WP8AXOxQvz6Nm",
        { action: "register" }
      ).then(function(token) {
        captchaToken = token;
        status.textContent = "Vérification réussie ✓";
      }).catch(function(err) {
        status.textContent = "Erreur reCAPTCHA";
        status.className = "error";
        console.error(err);
      });
    }

    /**
     * Appelé depuis Java pour lire le token.
     * Retourne "" si pas encore prêt.
     */
    function getCaptchaToken() {
      return captchaToken;
    }
  </script>
</body>
</html>
